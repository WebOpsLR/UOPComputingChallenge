# DO NOT EDIT THIS FILE
#
# This is the Helm template for the Deployment, it runs your chosen image as
# one or more pods and keeps them running. The {{ ... }} parts are filled in
# from values.yaml when you run `terraform apply`, so edit the values in there.
apiVersion: apps/v1
kind: Deployment
metadata:
  # Name of the Deployment, e.g. "hello-challenge". Comes from the helpers file.
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  # How many copies (pods) of the app to run 
  # (values.yaml: replicaCount)
  replicas: {{ .Values.replicaCount }}
  # Which pods this Deployment manages, matched by their labels.
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  # Template describing the pods this Deployment creates.
  template:
    metadata:
      labels:
        {{- include "app.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          # The image to run, built as "repository:tag" from values.yaml.
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          # When to pull the image (values.yaml: image.pullPolicy).
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
              # The port the app listens on inside the container, named "http"
              # so the Service and the probes below can refer to it by name.
              # (values.yaml: containerPort)
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          # Liveness probe: Kubernetes restarts the pod if this check fails.
          # It requests "/" on the http port; adjust in values/hints if your
          # app serves health somewhere else.
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          # Readiness probe: the pod only receives traffic once this passes.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          # CPU/memory requests and limits (values.yaml: resources).
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
