# DO NOT EDIT THIS FILE
#
# This is the Helm template for the Service, it exposes your app so you can
# reach it in a browser. The {{ ... }} parts are filled in from values.yaml
# when you run `terraform apply`, so edit the values in there.
apiVersion: v1
kind: Service
metadata:
  # Name of the Service, e.g. "hello-challenge". Comes from the helpers file.
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  # How the app is exposed. "NodePort" makes it reachable from outside the
  # cluster, which is what minikube service uses.
  # (values.yaml: service.type)
  type: {{ .Values.service.type }}
  ports:
      # The port the Service exposes inside the cluster
      # (values.yaml: service.port)
    - port: {{ .Values.service.port }}
      # Forwards to the container's "http" port, i.e. containerPort.
      targetPort: http
      protocol: TCP
      name: http
      # The port exposed on your machine, only added for a NodePort service.
      # (values.yaml: service.nodePort)
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  # Tells the Service which pods to send traffic to, by matching their labels.
  selector:
    {{- include "app.selectorLabels" . | nindent 4 }}
